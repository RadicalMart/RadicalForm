PLG_RADICALFORM="Система - RadicalForm"
PLG_RADICALFORM_DESC="<p>Професійний підхід до створення форм зворотного зв'язку.<br /> Ви самостійно створюєте форму на сторінці сайту за допомогою HTML-тегів. <br />Щоб вона запрацювала, потрібно лише призначити клас <strong>rf-button-send</strong> кнопці, яка виконує функцію надсилання.</p><p>Докладна документація — <a href='https://radicalmart.ru/all/radicalform' target='_blank'>https://radicalmart.ru/all/radicalform</a></p>"
PLG_RADICALFORM_VERSION="Версія плагіна: __DEPLOY_VERSION__"
PLG_RADICALFORM_DANGER_CLASS="CSS-клас для невалідних полів"
PLG_RADICALFORM_DANGER_CLASS_DESCRIPTION="Полям форми, які заповнені неправильно та не пройшли валідацію або не заповнені, хоча позначені як обов'язкові, буде призначено цей клас. Можна вказати кілька класів, розділених пробілами."
PLG_RADICALFORM_ERROR_FILE="CSS-клас помилок файлів"
PLG_RADICALFORM_ERROR_FILE_DESCRIPTION="CSS-клас для повідомлень про помилки під час завантаження файлів. Ці повідомлення з'являються в полі списку файлів, позначеному CSS-класом rf-filenames-list."
PLG_RADICALFORM_RF_CALL_0="JavaScript №0 (викликається перед надсиланням форми)"
PLG_RADICALFORM_RF_CALL_0_DESCRIPTION="JavaScript №0 виконується перед надсиланням форми. Доступні змінні 'here', яка вказує на натиснуту кнопку, і 'needReturn', яка містить статус валідації форми та дорівнює true, якщо форма не пройшла валідацію. Можна заблокувати надсилання форми, якщо повернути false у цій функції."
PLG_RADICALFORM_RF_CALL_1="Код JavaScript №1"
PLG_RADICALFORM_RF_CALL_1_DESCRIPTION="Код JavaScript №1, який викликається після надсилання форми, якщо його вказано в параметрі кнопки data-rf-call. Наприклад, data-rf-call='1'. Можна вказати кілька функцій. Наприклад, data-rf-call='12'. Доступні змінні here та rfMessage."
PLG_RADICALFORM_RF_CALL_2="Код JavaScript №2 (для виведення повідомлення)"
PLG_RADICALFORM_RF_CALL_2_DESCRIPTION="Код JavaScript №2, який зазвичай використовується для виведення повідомлення про успішне або неуспішне надсилання форми. За замовчуванням завжди виконується після надсилання форми. Параметр функції rfMessage містить текст повідомлення, що виводиться. Доступна змінна here, яка вказує на натиснуту кнопку."
PLG_RADICALFORM_RF_CALL_3="Код JavaScript №3"
PLG_RADICALFORM_RF_CALL_3_DESCRIPTION="Код JavaScript №3, який викликається, якщо його вказано в параметрі кнопки data-rf-call. Наприклад, data-rf-call='3'. Доступні змінні here та rfMessage."
PLG_RADICALFORM_EMAIL="Куди надсилати листи"
PLG_RADICALFORM_WAIT_MESSAGE="Повідомлення «Зачекайте»"
PLG_RADICALFORM_DEFAULT_WAIT_MESSAGE="Зачекайте..."
PLG_RADICALFORM_WAIT_MESSAGE_DESCRIPTION="На час надсилання повідомлення кнопка отримує статус disabled і змінює текст на вказаний. Сюди можна вставляти іконки або інший HTML-текст. Можна використовувати HTML-теги, але не можна використовувати апостроф — '"
PLG_RADICALFORM_EMAIL_CC="Кому надсилати копію листа"
PLG_RADICALFORM_EMAIL_BCC="Прихована копія листа"
PLG_RADICALFORM_AFTERSEND="Повідомлення після надсилання форми"
PLG_RADICALFORM_AFTERSEND_DESCRIPTION="Повідомлення, яке виводиться після успішного надсилання форми. Можна використовувати HTML-теги, але не можна використовувати апостроф — '"
PLG_RADICALFORM_MAXFILE="Розмір вкладень не більше ніж (мегабайт)"
PLG_RADICALFORM_MAXFILE_DESCRIPTION="Для кожного поштового сервера існує обмеження на максимальний розмір вкладень. Для більшості серверів воно становить 20 МБ."
PLG_RADICALFORM_WAITING_FOR_UPLOAD="Повідомлення «Зачекайте» для завантаження файлів"
PLG_RADICALFORM_WAITING_FOR_UPLOAD_DESCRIPTION="На час завантаження файлу на сервер кнопка блокується, і на ній з'являється вказаний тут напис. Можна використовувати HTML-теги для вставлення іконок очікування, але не використовуйте апостроф — '"
PLG_RADICALFORM_ADVANCEDPARAMS="Інтеграція з іншими сервісами"
PLG_RADICALFORM_TELEGRAM_LABEL="Увімкнути Telegram"
PLG_RADICALFORM_TELEGRAM_DESCRIPTION="Увімкнути надсилання повідомлень через Telegram-бота"
PLG_RADICALFORM_TELEGRAM_TOKEN="Токен HTTP API"
PLG_RADICALFORM_TELEGRAM_TOKEN_DESCRIPTION="Токен HTTP API Telegram, отриманий від бота BotFather. Докладніше дивіться в описі плагіна."
PLG_RADICALFORM_EMAILON_LABEL="Надсилання email"
PLG_RADICALFORM_EMAILON_DESCRIPTION="Увімкнути надсилання email під час надсилання форми. Вимкнення має сенс, якщо використовується інтеграція з іншими сервісами."
PLG_RADICALFORM_TELEGRAMCHECK_LABEL="Оновити chat_id"
PLG_RADICALFORM_TELEGRAMCHATIDCHOOSE_LABEL="Вибрати отримувачів"
PLG_RADICALFORM_TELEGRAMCHATIDCHOOSE_DESC="Виберіть адресатів для надсилання повідомлень у Telegram. Унікальною адресою є chat_id. Щоб отримати його, надішліть боту повідомлення, а потім натисніть кнопку «Оновити chat_id»."
PLG_RADICALFORM_MAX_LABEL="Увімкнути MAX"
PLG_RADICALFORM_MAX_DESCRIPTION="Увімкнути надсилання повідомлень через бота MAX"
PLG_RADICALFORM_MAX_TOKEN="Токен бота MAX"
PLG_RADICALFORM_MAX_TOKEN_DESCRIPTION="Токен для HTTP API MAX. Його можна отримати в налаштуваннях чат-бота MAX у розділі інтеграції."
PLG_RADICALFORM_MAX_RECIPIENTS_LABEL="Вибрати отримувачів у MAX"
PLG_RADICALFORM_MAX_RECIPIENTS_DESC="Виберіть адресатів MAX. Для надсилання використовується ID отримувача та тип адресації. Поле Name використовується лише як підпис для зручності. Щоб отримати ID, надішліть повідомлення боту MAX і натисніть кнопку оновлення."
PLG_RADICALFORM_MAX_CHECK_LABEL="Оновити MAX ID"
PLG_RADICALFORM_MAX_CONNECTION_CHECK_LABEL="Перевірити підключення MAX"
PLG_RADICALFORM_MAX_CONNECTION_TOKEN_MISSING="Спочатку збережіть токен бота MAX."
PLG_RADICALFORM_MAX_CONNECTION_SUCCESS="З'єднання з MAX API встановлено. TLS-сертифікату довірено, токен дійсний. Бот: <strong>%s</strong>."
PLG_RADICALFORM_MAX_CONNECTION_TLS_ERROR="Не вдалося перевірити TLS-сертифікат MAX. Додайте сертифікат Мінцифри РФ до довіреного сховища PHP/cURL. Помилка: %s"
PLG_RADICALFORM_MAX_CONNECTION_TOKEN_ERROR="TLS-сертифікату MAX довірено, але токен бота недійсний."
PLG_RADICALFORM_MAX_CONNECTION_API_ERROR="TLS-сертифікату MAX довірено, але API повернув помилку HTTP %s: %s"
PLG_RADICALFORM_MAX_CONNECTION_NETWORK_ERROR="Не вдалося підключитися до MAX API. Помилка: %s"
PLG_RADICALFORM_MAX_SEND_ERROR="Помилка надсилання повідомлення до MAX"
PLG_RADICALFORM_MAX_MARKER_INITIALIZED="Маркер оновлень MAX збережено. Надішліть нове повідомлення боту MAX і натисніть оновлення ще раз."
PLG_RADICALFORM_MAX_NO_RECIPIENTS="Нових повідомлень боту MAX не знайдено. Надішліть повідомлення боту та натисніть оновлення ще раз."
PLG_RADICALFORM_HISTORY="Історія надсилання форм"
PLG_RADICALFORM_HISTORY_EMPTY="Історія надсилання форм у файлі <strong>%s</strong> порожня"
PLG_RADICALFORM_HISTORY_FILE_NOT_READABLE="Файл журналу знайдено, але він недоступний для читання: <strong>%s</strong>"
PLG_RADICALFORM_HISTORY_FILE_NO_VALID_ROWS="Файл журналу прочитано, але в ньому не знайдено коректних рядків історії: <strong>%s</strong>"
PLG_RADICALFORM_HISTORY_FILE_NO_READABLE_ROWS="Файл журналу не порожній, але рядки історії не вдалося прочитати: <strong>%s</strong>"
PLG_RADICALFORM_HISTORY_TIME="Час"
PLG_RADICALFORM_HISTORY_DATE="Дата"
PLG_RADICALFORM_HISTORY_TARGET="TargetID"
PLG_RADICALFORM_HISTORY_IP="IP-адреса"
PLG_RADICALFORM_SHOWTARGET="Показувати TargetID у таблиці"
PLG_RADICALFORM_SHOWTARGET_DESCRIPTION="Показувати стовпець TargetID в історії надсилання форм. TargetID — це адресат форми."
PLG_RADICALFORM_HISTORY_MESSAGE="Надіслані дані"
PLG_RADICALFORM_MAXLOGFILE="Очищати журнал після досягнення розміру (байт)"
PLG_RADICALFORM_MAXLOGFILE_DESC="Щоб не переповнювати сервер журналами, плагін регулярно очищає журнал надісланих форм. Тут можна вказати максимальний розмір файлу, після досягнення якого його буде очищено. Якщо журнал не потрібно очищати, просто вкажіть достатньо велике число, наприклад 100000000."
PLG_RADICALFORM_HISTORY_SIZE="Розмір файлу журналу: "
PLG_RADICALFORM_SPAM_HISTORY_SIZE="Розмір файлу спам-журналу: "
PLG_RADICALFORM_HISTORY_BYTE="байт. "
PLG_RADICALFORM_HISTORY_CLEAR="Видалити файл «%s»"
PLG_RADICALFORM_LOG_MESSAGES="Повідомлення"
PLG_RADICALFORM_LOG_SPAM="Спам"
PLG_RADICALFORM_WELCOME_MESSAGE="Перейти до налаштувань плагіна — <a class=\"btn btn-primary text-white text-decoration-none\" href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=radicalform&filter[search]=\">Налаштування RadicalForm</a>"
PLG_RADICALFORM_HIDDENINFO="Додаткова інформація про відвідувача"
PLG_RADICALFORM_HIDDENINFO_DESCRIPTION="Кожна надіслана форма містить додаткову інформацію: реферер, адресу сторінки та роздільну здатність екрана. Ви можете вибрати, показувати цю інформацію в журналі чи ні. Після зміни значення не забудьте зберегти налаштування."
PLG_RADICALFORM_ALTERNATIVEEMAILS_LABEL="Альтернативні адреси email"
PLG_RADICALFORM_ALTERNATIVEEMAILS_DESC="Якщо адреса email для доставлення форми має відрізнятися від заданої за замовчуванням, укажіть її тут і призначте певний Target ID, за яким вона буде ідентифікуватися у самій формі."
PLG_RADICALFORM_REPLY_TO="Назва поля «Відповісти на»"
PLG_RADICALFORM_REPLY_TO_DESC="Якщо у формі передбачено поле для email, можна зробити так, щоб значення цього поля автоматично використовувалося як адреса для відповіді. Тут потрібно вказати назву поля, значення якого буде вибрано як адресу для відповіді. Якщо ця функція не потрібна, вкажіть неіснуюче поле або просто залиште значення порожнім."
PLG_RADICALFORM_WRONG_PHP="Потрібна версія PHP не нижче %s"
PLG_RADICALFORM_GLUE="Роздільник множинних полів"
PLG_RADICALFORM_GLUE_DESCRIPTION="Якщо для поля налаштовано введення кількох значень, це роздільник, яким значення поля будуть відокремлюватися одне від одного."
PLG_RADICALFORM_EXTENDED_INFO="Додаткова інформація про відвідувача"
PLG_RADICALFORM_EXTENDED_INFO_DESC="Додавати до тіла листа розширену інформацію про відвідувача сайту: IP-адресу, реферер і роздільну здатність екрана."
PLG_RADICALFORM_JIVOSITE_LABEL="Увімкнути Jivosite"
PLG_RADICALFORM_JIVOSITE_DESCRIPTION="Увімкнути інтеграцію із сервісом Jivosite. Код Jivosite уже має бути встановлений на вашому сайті. Поля phone, email і name будуть передані до системи Jivosite, якщо вони мають відповідні назви."
PLG_RADICALFORM_PROXY_LABEL="Увімкнути проксі"
PLG_RADICALFORM_PROXY_DESCRIPTION="Якщо ваш провайдер блокує звернення до серверів Telegram, ви можете використовувати проксі типу SOCKS5."
PLG_RADICALFORM_PROXYLOGIN_LABEL="Логін проксі"
PLG_RADICALFORM_PROXYLOGIN_DESCRIPTION="Логін вашого проксі-сервера"
PLG_RADICALFORM_PROXYPASSWORD_LABEL="Пароль проксі"
PLG_RADICALFORM_PROXYPASSWORD_DESCRIPTION="Пароль вашого проксі-сервера"
PLG_RADICALFORM_PROXYADDRESS_LABEL="Адреса проксі"
PLG_RADICALFORM_PROXYADDRESS_DESCRIPTION="Адреса вашого проксі-сервера"
PLG_RADICALFORM_PROXYPORT_LABEL="Порт проксі"
PLG_RADICALFORM_PROXYPORT_DESCRIPTION="Порт вашого проксі-сервера"
PLG_RADICALFORM_WRONG_JOOMLA="Ваша версія Joomla застаріла. Плагін працюватиме лише на Joomla версії %s або новішої. Не вмикайте плагін!"
PLG_RADICALFORM_CUSTOMCODEON_LABEL="Використовувати власний код"
PLG_RADICALFORM_CUSTOMCODEON_DESCRIPTION="Можна виконувати власний код для всіх форм на сайті або лише для форм, указаних за допомогою Target ID. Створіть файл зі своїм кодом у папці /templates/your_template/html/plg_system_radicalform і вкажіть його назву як Layout."
PLG_RADICALFORM_CUSTOMCODE_LABEL="Укажіть назву вашого файлу"
PLG_RADICALFORM_CUSTOMCODE_DESC="Укажіть тут назву вашого файлу, розташованого в папці /templates/your_template/html/plg_system_radicalform."
PLG_RADICALFORM_KEEPALIVE="Підтримувати сесію користувача"
PLG_RADICALFORM_KEEPALIVE_DESC="Якщо користувач перебуває на сторінці довше, ніж установлено в налаштуваннях Joomla для сесії, під час спроби надіслати форму він отримає повідомлення про неправильний CSRF-токен. Цей параметр дає змогу уникнути такої ситуації. Ви можете вимкнути його та просто збільшити час сесії, наприклад до 3–4 годин."
PLG_RADICALFORM_SHOWTARGET_DONTFORGET="Не забудьте зберегти зміни!"
PLG_RADICALFORM_SHOWTARGET_DONTFORGET_DESCRIPTION="Зміни параметрів не буде застосовано, доки ви не натиснете кнопку «Зберегти»."
PLG_RADICALFORM_VERBOX_LABEL="Увімкнути Verbox"
PLG_RADICALFORM_VERBOX_DESCRIPTION="Увімкнути інтеграцію із сервісом Verbox. Поля phone, email і name будуть передані з ваших форм до полів клієнта. Код віджета Verbox має бути встановлений на вашому сайті."
PLG_RADICALFORM_HISTORY_FORMID="Form&nbsp;ID"
PLG_RADICALFORM_INSERTFORMID="Додавати ідентифікатор форми до тіла повідомлення"
PLG_RADICALFORM_INSERTFORMID_DESC="Якщо ввімкнути цей параметр, ідентифікатор форми буде додано до полів повідомлення. Ідентифікатор можна використовувати як мовну константу та додати зрозуміле повідомлення."
PLG_RADICALFORM_SHOWFORMID="Показувати Form ID у таблиці"
PLG_RADICALFORM_SHOWFORMID_DESCRIPTION="Показувати стовпець Form ID в історії надсилання форм. Form ID — це ідентифікатор форми, для якого використовується атрибут id форми."
PLG_RADICALFORM_HISTORY_NUMBER_CLEAR="Скинути нумерацію"
PLG_RADICALFORM_INSERTIP="Вставити IP-адресу на сторінку"
PLG_RADICALFORM_INSERTIP_DESC="Іноді може знадобитися передавати IP-адресу відвідувача до різних систем аналітики даних. Для цього плагін може вставляти на сторінку JS-змінну з IP-адресою відвідувача. Її назва — RadicalForm.IP.ip. Ви можете використовувати цю змінну на власний розсуд, якщо цей перемикач увімкнено."
PLG_RADICALFORM_TRACK_UTM_LABEL="Відстежувати UTM-мітки"
PLG_RADICALFORM_TRACK_UTM_DESC="Збирати UTM-мітки (utm_source, utm_medium, utm_campaign, utm_term, utm_content) з URL і передавати їх разом із надсиланням форми."
PLG_RADICALFORM_TRACK_UTM_LIFETIME_LABEL="Час зберігання UTM-міток"
PLG_RADICALFORM_TRACK_UTM_LIFETIME_DESC="Кількість хвилин, протягом яких UTM-мітки з URL будуть доступні для надсилання форм. Укажіть 0, щоб зберігати їх до завершення поточної сесії Joomla."
PLG_RADICALFORM_TRACK_UTM_ALLOWED_TAGS_LABEL="Дозволені UTM-мітки"
PLG_RADICALFORM_TRACK_UTM_ALLOWED_TAGS_DESC="Список GET-параметрів, які буде збережено як UTM-мітки, через кому. Наприклад: utm_source, utm_medium, utm_campaign, utm_term, utm_content."
PLG_RADICALFORM_EXPORT_CSV="Експорт <strong>%s</strong> у CSV"
PLG_RADICALFORM_EXPORT_CSV_WITH_FIELDS="Експорт у CSV за полями"
PLG_RADICALFORM_WARNING_ABOUT_ROTATION="Днів до очищення журналу — <strong>%d</strong>. Кількість файлів ротації: <strong>%d</strong>.<br>Вимкнути або налаштувати параметри ротації можна <a href='index.php?option=com_scheduler&view=tasks' target='_blank'>тут</a> "
PLG_RADICALFORM_FILE_LOGS="Файли журналів: "
PLG_RADICALFORM_RF_CALL_9ON="Використовувати окремий код для виведення помилок"
PLG_RADICALFORM_RF_CALL_9ON_DESCRIPTION="Для виведення помилок під час роботи скрипту буде використовуватися окремий код, до якого можна додати виведення в консоль або інший спосіб журналювання."
PLG_RADICALFORM_RF_CALL_9="Код JavaScript для виведення помилок"
PLG_RADICALFORM_RF_CALL_9_DESCRIPTION="Код JavaScript, який використовуватиметься для виведення помилок під час роботи скрипту. Доступні параметри: <strong>rfMessage</strong> — текст помилки та <strong>here</strong> — посилання на кнопку."
PLG_RADICALFORM_FILESPARAMS="Файли"
PLG_RADICALFORM_UPLOADENABLED_LABEL="Дозволити завантаження файлів"
PLG_RADICALFORM_UPLOADENABLED_DESCRIPTION="Якщо вимкнено, параметри завантаження файлів приховуються, а завантаження файлів через форми блокується."
PLG_RADICALFORM_ATTACHFILES_LABEL="Додавати файли до листа як вкладення"
PLG_RADICALFORM_ATTACHFILES_DESCRIPTION="Файли, завантажені через форму, зазвичай додаються до листа у вигляді посилань. Це дає змогу завантажувати великі файли на сервер, майже не обмежуючи їхній розмір і кількість. Однак ви можете додатково ввімкнути додавання файлів безпосередньо до листа. Зазвичай максимальний розмір обмежено 20 МБ, а надсилання потребує додаткового часу. Тому цей параметр за замовчуванням вимкнено."
PLG_RADICALFORM_MAXSTORAGE="Максимальний розмір сховища в МБ"
PLG_RADICALFORM_MAXSTORAGE_DESCRIPTION="Усі завантажені файли зберігаються на вашому хостингу. Оскільки його обсяг обмежений, укажіть максимальний простір, який ви можете виділити для файлів. У разі перевищення цього розміру користувачеві буде відмовлено в завантаженні."
PLG_RADICALFORM_UPLOADSTORAGE="Шлях зберігання завантажених файлів"
PLG_RADICALFORM_UPLOADSTORAGE_DESCRIPTION="Повний шлях до папки, у якій зберігаються файли, завантажені через форму. З міркувань безпеки цю папку можна винести за межі каталогу Joomla, але можна залишити й розташування за замовчуванням — воно цілком безпечне. Щоб повторно згенерувати адресу, просто очистьте це поле."
PLG_RADICALFORM_DELIMITER="Роздільник вкладених файлів"
PLG_RADICALFORM_DELIMITER_DESCRIPTION="Роздільник, який використовуватиметься під час вставлення файлів у листи та повідомлення месенджерів."
PLG_RADICALFORM_MAXTIME="Термін зберігання вкладень на сайті (днів)"
PLG_RADICALFORM_MAXSTIME_DESCRIPTION="Максимальний термін зберігання файлів, переданих через форму на вашому сайті. Після завершення цього терміну файли видаляються."
PLG_RADICALFORM_DOWNLOADPATH="Шлях для завантаження файлів"
PLG_RADICALFORM_DOWNLOADPATH_DESCRIPTION="Частина адреси, яка використовується для завантаження файлів із сайту — посилань на вкладені файли."
PLG_RADICALFORM_TELEGRAMERROR="Сталася помилка"
PLG_RADICALFORM_TELEGRAMERROR_DESCRIPTION="<span>Сталася помилка</span>"
PLG_RADICALFORM_TOTALSIZE="Виділено для сховища: <strong>%s</strong> МБ, зайнято у сховищі: <strong>%s</strong> МБ<br>"
PLG_RADICALFORM_TOTALFREE="Вільно у сховищі: <strong>%s</strong> МБ, усього вільно в системі: <strong>%s</strong> МБ<br>"
PLG_RADICALFORM_TOTALDANGER="Вільний простір, виділений для сховища, перевищує загальний обсяг вільного простору в системі."
PLG_RADICALFORM_BUTTONDELETECOLORBACKGROUND="Фон кнопки видалення"
PLG_RADICALFORM_BUTTONDELETECOLORBACKGROUND_DESCRIPTION="Шістнадцятковий код кольору фону кнопки видалення файлів, яка з'являється поруч із завантаженими користувачем файлами. Вигляд кнопки також можна суттєво змінити за допомогою CSS-класу rf-button-delete."
PLG_RADICALFORM_BUTTONDELETECOLOR="Колір кнопки видалення"
PLG_RADICALFORM_BUTTONDELETECOLOR_DESCRIPTION="Шістнадцятковий код кольору кнопки видалення файлів, яка з'являється поруч із завантаженими користувачем файлами. Вигляд кнопки також можна суттєво змінити за допомогою CSS-класу rf-button-delete."
PLG_RADICALFORM_USER_TIME="Час на пристрої користувача: "
PLG_RADICALFORM_FORM_DURATION="Надіслано через: "
PLG_RADICALFORM_ANTISPAM="Антиспам"
PLG_RADICALFORM_JS_CHALLENGE="Перевірка виконання JavaScript"
PLG_RADICALFORM_JS_CHALLENGE_DESC="Перед надсиланням форми браузер має виконати динамічне завдання й отримати одноразовий дозвіл. Це блокує прямі HTTP-запити, які не реалізують JavaScript-протокол RadicalForm."
PLG_RADICALFORM_JS_CHALLENGE_ENABLED="Вимагати JavaScript для надсилання"
PLG_RADICALFORM_JS_CHALLENGE_ENABLED_DESC="Відхиляти надсилання без чинного одноразового дозволу, отриманого після виконання JavaScript-завдання."
PLG_RADICALFORM_JS_CHALLENGE_DELAY_MS="Очікування перед підтвердженням, мс"
PLG_RADICALFORM_JS_CHALLENGE_DELAY_MS_DESC="Час очікування браузера перед підтвердженням JavaScript-завдання. Допустимий діапазон: 100–1000 мс. Сервер ураховує похибку таймера 50 мс."
PLG_RADICALFORM_JS_CHALLENGE_MESSAGE="Повідомлення про помилку перевірки JavaScript"
PLG_RADICALFORM_JS_CHALLENGE_MESSAGE_DESC="Повідомлення, що повертається, якщо дозвіл відсутній, прострочений або використаний повторно. Можна вказати мовну константу."
PLG_RADICALFORM_JS_CHALLENGE_FAILED="Не вдалося підтвердити виконання JavaScript. Оновіть сторінку та повторіть надсилання форми."
PLG_RADICALFORM_ANTISPAM_MESSAGE="Повідомлення під час блокування"
PLG_RADICALFORM_ANTISPAM_MESSAGE_DESC="Повідомлення, яке буде повернуто відвідувачеві, якщо форму заблоковано антиспамом. Якщо залишити поле порожнім, буде використано текст за замовчуванням."
PLG_RADICALFORM_DURATION_RANGE="Діапазони затримки перед надсиланням форми, що блокуються"
PLG_RADICALFORM_DURATION_RANGE_DESC="Укажіть один або кілька діапазонів у секундах через кому у форматі min-max. Якщо значення rf-duration потрапляє до будь-якого з діапазонів, форму буде заблоковано. Приклади: 0-10, 12.90-13.00"
PLG_RADICALFORM_IP_BLACKLIST="Чорний список IP-адрес"
PLG_RADICALFORM_IP_BLACKLIST_DESC="По одному запису IPv4 або IPv4 CIDR у рядку. Приклади: 203.0.113.15 або 198.51.100.0/24. Рядки, що починаються із символу #, ігноруються."
PLG_RADICALFORM_CONTENT_RULES="Правила блокування за вмістом"
PLG_RADICALFORM_CONTENT_RULES_DESC="Правила блокування надсилання форми за вмістом її полів. Залиште список порожнім, щоб вимкнути цю перевірку."
PLG_RADICALFORM_CONTENT_RULE_FIELDS="Поля"
PLG_RADICALFORM_CONTENT_RULE_FIELDS_DESC="Назви полів через кому, наприклад: name, message, email, rfUserAgent. Використовуйте * або залиште поле порожнім для перевірки всіх полів форми та доступних системних полів."
PLG_RADICALFORM_CONTENT_RULE_MODE="Тип правила"
PLG_RADICALFORM_CONTENT_RULE_MODE_CONTAINS="Містить"
PLG_RADICALFORM_CONTENT_RULE_MODE_REGEX="Регулярний вираз"
PLG_RADICALFORM_CONTENT_RULE_PATTERN="Шаблон"
PLG_RADICALFORM_CONTENT_RULE_PATTERN_DESC="Підрядок для режиму «Містить» або повний регулярний вираз PHP із роздільниками для режиму «Регулярний вираз»."
PLG_RADICALFORM_CONTENT_RULE_COMMENT="Коментар"
PLG_RADICALFORM_CONTENT_RULE_COMMENT_DESC="Необов'язкова примітка для адміністратора."
PLG_RADICALFORM_CONTENT_RULE_REGEX_NOTE_LABEL="Приклади регулярних виразів"
PLG_RADICALFORM_CONTENT_RULE_REGEX_NOTE="<div class='rf-regex-examples-grid'><div class='rf-regex-example'><strong>Будь-яка адреса Gmail:</strong><code>/@gmail\.com$/i</code></div><div class='rf-regex-example'><strong>Адреса Gmail, у якій перед @ є крапка:</strong><code>/^[^@\s]+\.[^@\s]+@gmail\.com$/i</code></div><div class='rf-regex-example'><strong>Адреса Gmail із кількома сегментами через крапки, що часто трапляється у спамі:</strong><code>/^[^@\s]+(?:\.[^@\s]+){2,}@gmail\.com$/i</code></div><div class='rf-regex-example'><strong>Посилання в повідомленні:</strong><code>/(https?:\/\/|www\.)/i</code></div><div class='rf-regex-example'><strong>Типові спам-слова:</strong><code>/(casino|betting|slots|viagra)/iu</code></div><div class='rf-regex-example'><strong>Повідомлення, яке містить лише латинські літери, цифри або символи без пробілів, що часто трапляється у сміттєвих повідомленнях:</strong><code>/^[A-Za-z0-9._-]{12,}$/</code></div></div><div class='rf-regex-examples-help'><strong>i</strong> — без урахування регістру.<br><strong>u</strong> — коректна робота з UTF-8, включно з кирилицею.</div>"
PLG_RADICALFORM_BURST_BLOCKING="Блокування під час сплеску"
PLG_RADICALFORM_BURST_BLOCKING_DESC="Якщо за вказаний період кількість надісланих форм досягне встановленого максимуму, подальше надсилання буде тимчасово заблоковано. Ураховуються лише форми, що пройшли антиспам-перевірки."
PLG_RADICALFORM_BURST_BLOCK_ENABLED="Увімкнути блокування під час сплеску"
PLG_RADICALFORM_BURST_BLOCK_ENABLED_DESC="Тимчасово зупиняти всі зовнішні плагіни та канали надсилання в разі різкого збільшення кількості форм."
PLG_RADICALFORM_BURST_MAX_SUBMISSIONS="Максимальна кількість надсилань за період"
PLG_RADICALFORM_BURST_MAX_SUBMISSIONS_DESC="Кількість форм, які можна надіслати протягом періоду спостереження до початку тимчасового блокування."
PLG_RADICALFORM_BURST_OBSERVATION_MINUTES="Період спостереження, хвилин"
PLG_RADICALFORM_BURST_OBSERVATION_MINUTES_DESC="Інтервал, за який підраховуються надіслані форми."
PLG_RADICALFORM_BURST_BLOCK_MINUTES="Тривалість блокування, хвилин"
PLG_RADICALFORM_BURST_BLOCK_MINUTES_DESC="Час, протягом якого надсилання буде зупинено після виявлення сплеску. Заблоковані спроби не подовжують цей період."
PLG_RADICALFORM_DAILY_BLOCKING="Добове блокування"
PLG_RADICALFORM_DAILY_BLOCKING_DESC="Зупиняє надсилання форм після досягнення максимуму за поточну календарну добу в часовому поясі Joomla. Надсилання відновиться на початку наступної доби."
PLG_RADICALFORM_DAILY_BLOCK_ENABLED="Увімкнути добове блокування"
PLG_RADICALFORM_DAILY_BLOCK_ENABLED_DESC="Установити абсолютний максимум оброблених форм за календарну добу."
PLG_RADICALFORM_DAILY_MAX_SUBMISSIONS="Максимум надсилань за добу"
PLG_RADICALFORM_DAILY_MAX_SUBMISSIONS_DESC="Після досягнення цієї кількості подальше надсилання буде заблоковано до початку наступної доби."
PLG_RADICALFORM_ANTIFLOOD_ALERT_EMAIL="Email для сповіщень про блокування"
PLG_RADICALFORM_ANTIFLOOD_ALERT_EMAIL_DESC="На початку кожного епізоду блокування на цю адресу буде надіслано одне сповіщення. Залиште поле порожнім, щоб вимкнути сповіщення."
PLG_RADICALFORM_ANTIFLOOD_MESSAGE="Повідомлення відвідувачу під час блокування"
PLG_RADICALFORM_ANTIFLOOD_MESSAGE_DESC="Повідомлення, що повертається замість надсилання форми, поки блокування активне. Можна вказати мовну константу."
