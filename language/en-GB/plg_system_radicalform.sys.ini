PLG_RADICALFORM_ANTISPAM_MESSAGE="Block message"
PLG_RADICALFORM_ANTISPAM_MESSAGE_DESC="The message returned to the visitor when the form is blocked by anti-spam rules. If empty, the default message will be used."
PLG_RADICALFORM_DURATION_RANGE="Blocked form submit delay ranges"
PLG_RADICALFORM_DURATION_RANGE_DESC="Enter one or more ranges in seconds separated by commas in the format min-max. If rf-duration falls into any range, the form will be blocked. Examples: 0-10, 12.90-13.00"
PLG_RADICALFORM_IP_BLACKLIST="IP blacklist"
