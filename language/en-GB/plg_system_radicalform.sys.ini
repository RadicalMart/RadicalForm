PLG_RADICALFORM_CONTENT_RULE_PATTERN_DESC="Substring for Contains mode or a full PHP regular expression with delimiters for Regular expression mode."
PLG_RADICALFORM_CONTENT_RULE_COMMENT="Comment"
PLG_RADICALFORM_CONTENT_RULE_COMMENT_DESC="Optional note for the administrator."
PLG_RADICALFORM_CONTENT_RULE_REGEX_NOTE_LABEL="Examples of regular expressions"
PLG_RADICALFORM_CONTENT_RULE_REGEX_NOTE="<div class='rf-regex-examples-grid'><div class='rf-regex-example'><strong>Any gmail address:</strong><code>/@gmail\.com$/i</code></div><div class='rf-regex-example'><strong>Gmail address with a dot before @:</strong><code>/^[^@\s]+\.[^@\s]+@gmail\.com$/i</code></div><div class='rf-regex-example'><strong>Gmail address with multiple dot-separated segments, which is common in spam:</strong><code>/^[^@\s]+(?:\.[^@\s]+){2,}@gmail\.com$/i</code></div><div class='rf-regex-example'><strong>Link in the message:</strong><code>/(https?:\/\/|www\.)/i</code></div><div class='rf-regex-example'><strong>Typical spam words:</strong><code>/(casino|betting|slots|viagra)/iu</code></div><div class='rf-regex-example'><strong>Message containing only Latin letters, digits, or symbols without spaces, which is often a sign of junk:</strong><code>/^[A-Za-z0-9._-]{12,}$/</code></div></div><div class='rf-regex-examples-help'><strong>i</strong> means case-insensitive matching.<br><strong>u</strong> enables correct UTF-8 handling, including Cyrillic.</div>"
PLG_RADICALFORM_BURST_BLOCKING="Burst blocking"
PLG_RADICALFORM_BURST_BLOCKING_DESC="If the number of submitted forms reaches the configured maximum during the specified period, further submissions will be temporarily blocked. Only forms that passed the anti-spam checks are counted."
PLG_RADICALFORM_BURST_BLOCK_ENABLED="Enable burst blocking"
PLG_RADICALFORM_BURST_BLOCK_ENABLED_DESC="Temporarily stop all external plugins and delivery channels when the number of form submissions rises sharply."
PLG_RADICALFORM_BURST_MAX_SUBMISSIONS="Maximum submissions per period"
PLG_RADICALFORM_BURST_MAX_SUBMISSIONS_DESC="The number of forms that may be submitted during the observation period before temporary blocking starts."
PLG_RADICALFORM_BURST_OBSERVATION_MINUTES="Observation period, minutes"
PLG_RADICALFORM_BURST_OBSERVATION_MINUTES_DESC="The interval over which submitted forms are counted."
PLG_RADICALFORM_BURST_BLOCK_MINUTES="Blocking duration, minutes"
PLG_RADICALFORM_BURST_BLOCK_MINUTES_DESC="How long to stop submissions after a burst is detected. Blocked attempts do not extend this period."
PLG_RADICALFORM_DAILY_BLOCKING="Daily blocking"
PLG_RADICALFORM_DAILY_BLOCKING_DESC="Stops form submissions after the maximum for the current calendar day in the Joomla time zone is reached. Submissions resume at the start of the next day."
