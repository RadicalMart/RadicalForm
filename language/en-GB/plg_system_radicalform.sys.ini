PLG_RADICALFORM="System - RadicalForm"
PLG_RADICALFORM_DESC="<p>Expert approach to creating feedback forms.<br /> In order to create a form, you just need to set the <strong>rf-button-send</strong> class for the button that performs the send function.</p><p>More details at <a href='https://radicalmart.ru/all/radicalform' target='_blank'>https://radicalmart.ru/all/radicalform</a></p>"
